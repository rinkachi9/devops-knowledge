<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="title desc">
  <title id="title">The Three Ways of DevOps</title>
  <desc id="desc">Three panels. The First Way shows a single arrow from Development through Operations to the Customer, meaning fast flow of work from left to right. The Second Way shows the same stations with feedback arrows going from right to left, meaning fast feedback from production back to development. The Third Way shows the flow arrow with repeated loops along it, meaning continual experimentation and learning at every stage.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="470" fill="#fbfaf7"/>

  <!-- First Way -->
  <text x="20" y="40" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">The First Way: flow</text>
  <text x="20" y="62" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4b5563">Fast, smooth flow of work from development to operations to the customer</text>
  <rect x="60" y="80" width="150" height="46" rx="8" fill="#dbeafe" stroke="#1f4e79"/>
  <text x="135" y="108" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937">Development</text>
  <rect x="375" y="80" width="150" height="46" rx="8" fill="#dbeafe" stroke="#1f4e79"/>
  <text x="450" y="108" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937">Operations</text>
  <rect x="690" y="80" width="150" height="46" rx="8" fill="#dbeafe" stroke="#1f4e79"/>
  <text x="765" y="108" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937">Customer</text>
  <line x1="210" y1="103" x2="372" y2="103" stroke="#1f4e79" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="525" y1="103" x2="687" y2="103" stroke="#1f4e79" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Second Way -->
  <text x="20" y="182" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">The Second Way: feedback</text>
  <text x="20" y="204" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4b5563">Fast, constant feedback from right to left at every stage</text>
  <rect x="60" y="222" width="150" height="46" rx="8" fill="#dcfce7" stroke="#2e7d32"/>
  <text x="135" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937">Development</text>
  <rect x="375" y="222" width="150" height="46" rx="8" fill="#dcfce7" stroke="#2e7d32"/>
  <text x="450" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937">Operations</text>
  <rect x="690" y="222" width="150" height="46" rx="8" fill="#dcfce7" stroke="#2e7d32"/>
  <text x="765" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937">Customer</text>
  <line x1="210" y1="236" x2="372" y2="236" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="525" y1="236" x2="687" y2="236" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="687" y1="256" x2="528" y2="256" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrg)"/>
  <line x1="372" y1="256" x2="213" y2="256" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrg)"/>
  <text x="606" y="290" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2e7d32">telemetry, user feedback</text>
  <text x="292" y="290" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2e7d32">alerts, tests, reviews</text>

  <!-- Third Way -->
  <text x="20" y="322" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">The Third Way: continual learning and experimentation</text>
  <text x="20" y="342" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4b5563">Experiment, take risks, learn from failure and repeat at every stage</text>
  <rect x="60" y="380" width="150" height="46" rx="8" fill="#ffedd5" stroke="#b45309"/>
  <text x="135" y="408" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937">Development</text>
  <rect x="375" y="380" width="150" height="46" rx="8" fill="#ffedd5" stroke="#b45309"/>
  <text x="450" y="408" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937">Operations</text>
  <rect x="690" y="380" width="150" height="46" rx="8" fill="#ffedd5" stroke="#b45309"/>
  <text x="765" y="408" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937">Customer</text>
  <line x1="210" y1="403" x2="372" y2="403" stroke="#b45309" stroke-width="3" marker-end="url(#arro)"/>
  <line x1="525" y1="403" x2="687" y2="403" stroke="#b45309" stroke-width="3" marker-end="url(#arro)"/>
  <path d="M250,403 C250,440 300,440 300,403 C300,370 260,370 262,398" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arro)"/>
  <path d="M565,403 C565,440 615,440 615,403 C615,370 575,370 577,398" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arro)"/>
  <path d="M110,380 C110,350 160,350 160,376" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arro)"/>
  <path d="M425,380 C425,350 475,350 475,376" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arro)"/>
  <path d="M740,380 C740,350 790,350 790,376" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arro)"/>
  <text x="450" y="458" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b45309">loops: experiments, postmortems, improvement time, shared learning</text>
</svg>
