<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" role="img" aria-labelledby="title desc">
  <title id="title">Team Topologies: four team types and three interaction modes</title>
  <desc id="desc">Three stream-aligned teams are drawn as long horizontal bars, each delivering a flow of change toward customers on the right. Below them a platform team bar provides services to all of them, marked X-as-a-Service. An enabling team is drawn as a vertical bar crossing the stream-aligned teams, marked facilitating. A complicated-subsystem team is drawn as a box attached to one stream-aligned team, marked X-as-a-Service. One stream-aligned team overlaps the platform team in a zone marked collaboration.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f3e8ff"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#7c3aed" stroke-width="2"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="900" height="580" fill="#fbfaf7"/>
  <text x="20" y="34" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">Team types and interaction modes</text>

  <!-- customers -->
  <rect x="780" y="110" width="100" height="250" rx="10" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="830" y="240" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937">Customers</text>

  <!-- stream-aligned teams -->
  <rect x="60" y="120" width="660" height="50" rx="25" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="90" y="150" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937">Stream-aligned team: checkout</text>
  <rect x="60" y="200" width="660" height="50" rx="25" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="90" y="230" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937">Stream-aligned team: search</text>
  <rect x="60" y="280" width="660" height="50" rx="25" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="90" y="310" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937">Stream-aligned team: mobile app</text>
  <line x1="722" y1="145" x2="776" y2="145" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="722" y1="225" x2="776" y2="225" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="722" y1="305" x2="776" y2="305" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="749" y="136" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#374151">flow</text>

  <!-- enabling team -->
  <rect x="470" y="100" width="60" height="250" rx="20" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" fill-opacity="0.85"/>
  <text x="500" y="368" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1d4ed8">Enabling team</text>
  <text x="500" y="384" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1d4ed8">(facilitating)</text>
  <circle cx="500" cy="145" r="4" fill="#1d4ed8"/>
  <circle cx="500" cy="225" r="4" fill="#1d4ed8"/>
  <circle cx="500" cy="305" r="4" fill="#1d4ed8"/>

  <!-- complicated subsystem team -->
  <rect x="200" y="48" width="250" height="40" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="325" y="73" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">Complicated subsystem: fraud scoring</text>
  <text x="345" y="108" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#b91c1c">X-as-a-Service</text>
  <line x1="335" y1="88" x2="335" y2="118" stroke="#b91c1c" stroke-width="2"/>

  <!-- collaboration zone -->
  <rect x="160" y="322" width="150" height="118" fill="url(#hatch)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="320" y="390" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7c3aed">collaboration (time-boxed)</text>

  <!-- platform team -->
  <rect x="60" y="440" width="660" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="90" y="476" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937">Platform team: internal developer platform (CI/CD, runtime, observability)</text>
  <line x1="600" y1="438" x2="600" y2="334" stroke="#15803d" stroke-width="2" marker-end="url(#a)"/>
  <line x1="680" y1="438" x2="680" y2="334" stroke="#15803d" stroke-width="2" marker-end="url(#a)"/>
  <text x="640" y="425" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#15803d">X-as-a-Service</text>

  <!-- legend -->
  <text x="20" y="550" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151">Interaction modes: collaboration (hatched overlap), X-as-a-Service (arrows from a provider), facilitating (enabling team coaching across teams)</text>
</svg>
